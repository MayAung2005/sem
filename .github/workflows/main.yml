name: Java Application CI

on: push

jobs:
  build:
    name: Build and Test Application
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Start Docker Compose
        run: docker compose up --build -d

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker compose exec -T db mysqladmin ping -h 127.0.0.1 -uroot -pexample --silent; then
              echo "MySQL is responding"
              exit 0
            fi
            sleep 10
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Wait for application to finish
        run: |
          APP_ID=$(docker compose ps -a -q app)
          if [ -z "$APP_ID" ]; then
            echo "Application container not found"
            exit 1
          fi
          EXIT_CODE=$(docker wait "$APP_ID")
          docker compose logs app
          exit "$EXIT_CODE"

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
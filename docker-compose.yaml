services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy

  db:
    build: db/.
    restart: always
    ports:
      - "33061:3306"

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60
  
